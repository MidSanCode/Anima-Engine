[package]
name = "am-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anima engine crate: am-wasm"

[lib]
# 产物名必须是 anima_wasm.wasm：docs/ffi-contract.md 与 crates/am-wasm/src/lib.rs
# 的构建说明都按这个名字写。默认 [lib] 名跟着 crate 包名（am_wasm），
# 于是 wasm-bindgen 那一步会因找不到 anima_wasm.wasm 直接失败。
name = "anima_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
am-core.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.129"

[features]
default = []
# Web 端自绘（体积明显变大）；默认交给页面用 Canvas/WebGL 画。
gpu = ["am-core/gpu"]
