[package]
name = "am-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anima engine crate: am-core"

[dependencies]
am-anim.workspace = true
am-doc.workspace = true
am-eval.workspace = true
am-format.workspace = true
am-math.workspace = true
am-model.workspace = true
am-motion.workspace = true
am-physics.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# 渲染后端按需启用：wasm 目标可以关掉 GPU，只用 JSON 协议。
am-render = { workspace = true, optional = true }

[features]
default = ["gpu"]
gpu = ["dep:am-render"]

[dev-dependencies]
tempfile = "3.27.0"
