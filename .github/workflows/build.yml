name: Build Engine Core

# 构建引擎核心产物：各平台原生库 + CLI + wasm 绑定。
# 注意：不跑 cargo test --workspace —— 渲染测试需要真实 GPU 适配器，
# CI runner 上不可靠；各平台用 CLI 冒烟（validate 不需要 GPU）兜底。

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (universal)'
        type: boolean
        default: false
      build_android:
        description: 'Android (4 ABIs → .aar)'
        type: boolean
        default: false
      build_ios:
        description: 'iOS (device + simulator XCFramework)'
        type: boolean
        default: false
      build_web:
        description: 'Web (wasm-bindgen ES module)'
        type: boolean
        default: false
      publish_release:
        description: '发布到 Releases（标题与 tag = 版本号+构建数字）'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build DLL + CLI (release)
        run: |
          cargo build -p am-ffi --release
          cargo build -p am-cli --release
      - name: Smoke test (no GPU needed)
        run: |
          cargo run -p am-cli -- version
          cargo run -p am-cli -- validate samples/minimal
          cargo run -p am-cli -- export samples/minimal minimal.amproj
      - name: Stage
        shell: pwsh
        run: |
          $stage = "stage/anima-windows-x64"
          New-Item -ItemType Directory -Force "$stage/samples" | Out-Null
          Copy-Item target/release/anima.dll, target/release/anima.dll.lib, target/release/anima.lib $stage
          Copy-Item crates/am-ffi/bindings/include/anima.h $stage
          Copy-Item target/release/anima.exe "$stage/anima-cli.exe"
          Copy-Item samples/minimal "$stage/samples/minimal" -Recurse -Force
          Write-Output "STAGE=$stage" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: anima-Windows-x64
          path: stage/anima-windows-x64

  # ---------------------------------------------------------------- Linux
  linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build shared library + CLI
        run: |
          cargo build -p am-ffi --release
          cargo build -p am-cli --release
      - name: Smoke test
        run: |
          cargo run -p am-cli -- validate samples/minimal
          cargo run -p am-cli -- export samples/minimal minimal.amproj
      - name: Stage
        run: |
          stage=stage/anima-linux-x64
          mkdir -p "$stage/samples"
          cp target/release/libanima.so target/release/libanima.a "$stage/"
          cp crates/am-ffi/bindings/include/anima.h "$stage/"
          cp target/release/anima "$stage/anima-cli"
          cp -r samples/minimal "$stage/samples/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: anima-Linux-x64
          path: stage/anima-linux-x64

  # ---------------------------------------------------------------- macOS
  macos:
    if: inputs.build_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build both architectures
        run: |
          cargo build -p am-ffi --release --target aarch64-apple-darwin
          cargo build -p am-ffi --release --target x86_64-apple-darwin
      - name: Lipo universal dylib + build host CLI
        run: |
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/libanima.dylib \
            target/x86_64-apple-darwin/release/libanima.dylib \
            -output target/universal/release/libanima.dylib
          cargo build -p am-cli --release
      - name: Smoke test
        run: cargo run -p am-cli -- validate samples/minimal
      - name: Stage
        run: |
          stage=stage/anima-macos-universal
          mkdir -p "$stage/samples"
          cp target/universal/release/libanima.dylib "$stage/"
          cp crates/am-ffi/bindings/include/anima.h "$stage/"
          cp target/release/anima "$stage/anima-cli"
          cp -r samples/minimal "$stage/samples/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: anima-macOS-universal
          path: stage/anima-macos-universal

  # ---------------------------------------------------------------- Android
  # 每个 ABI 一个 cdylib（cargo-ndk 自动落盘到 jniLibs/<abi>/），
  # 汇总成 .aar —— 宿主 Gradle 直接 implementation(files("anima-android.aar"))，
  # 运行时 System.loadLibrary("anima") + JNI 按头文件调用。
  # 引擎不带 GPU 后端（--no-default-features）：Android 端先做数据/求值/物理，
  # 画面由引擎 scene JSON + 宿主 Vulkan/GL 绘制，后续要自绘再开 gpu feature。
  android:
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不用 setup-android：ubuntu-latest 预装完整 Android SDK（含 sdkmanager/
      # platform-tools），而 setup-android@v3 会尝试安装已废弃的 'tools' 包
      # 导致 sdkmanager 退出 1。唯一缺的是 NDK，由 setup-ndk 提供。
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install cargo-ndk
        # 锁大版本：cargo-ndk 4.x 把 platform 从 -p 改成 -P（-p 现在是 cargo 的
        # --package），换大版本可能再次改名，锁住避免构建意外失败。
        run: cargo install cargo-ndk --version "^4" --locked
      - name: Build all ABIs (no GPU backend)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # -t 可用 Android ABI 名；-o 让 cargo-ndk 自动落到 jniLibs/<abi>/libanima.so
          # 注意 -P 是 platform(API level)，不能写成 -p（那会被当成包名）。
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -P 21 \
            -o jniLibs \
            build -p am-ffi --release --no-default-features
          echo "--- 产物 ---"
          find jniLibs -name '*.so' | sort
      - name: Assemble .aar
        run: |
          # .aar = zip(jni/<abi>/lib*.so + classes.jar + AndroidManifest.xml)
          mkdir -p aar/jni aar/classes
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "aar/jni/$abi"
            cp "jniLibs/$abi/"*.so "aar/jni/$abi/"
          done
          # classes.jar：占位（无 Java API；宿主自己 loadLibrary + JNI）
          jar --create --file aar/classes.jar -C aar/classes .
          # 不写 package 属性：AGP 8+ 的库 manifest 由宿主侧命名空间决定
          cat > aar/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          (cd aar && zip -r ../anima-android.aar .)
      - name: Smoke test (host CLI, same core)
        run: cargo run -p am-cli -- validate samples/minimal
      - uses: actions/upload-artifact@v4
        with:
          name: anima-Android
          path: anima-android.aar

  # ---------------------------------------------------------------- iOS
  # App Store 禁止在 App 里带 dylib → 交付物用 **staticlib**（libanima.a），
  # 打成 XCFramework（设备 arm64 + 模拟器 arm64/x86_64）。
  # 同一 platform+variant 的多个 slice 必须先 lipo 合并，xcframework 才收。
  # 带 GPU 后端（wgpu Metal）：iOS 是渲染平台，引擎自绘可用。
  ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build device + simulator slices (staticlib, Metal on)
        run: |
          cargo build -p am-ffi --release --target aarch64-apple-ios
          cargo build -p am-ffi --release --target aarch64-apple-ios-sim
          cargo build -p am-ffi --release --target x86_64-apple-ios
      - name: Create XCFramework
        run: |
          mkdir -p target/universal-ios-sim ios-headers
          cp crates/am-ffi/bindings/include/anima.h ios-headers/
          # 模拟器两 slice（arm64-sim 与 x86_64）同属 iOS Simulator → 先 lipo
          lipo -create \
            target/aarch64-apple-ios-sim/release/libanima.a \
            target/x86_64-apple-ios/release/libanima.a \
            -output target/universal-ios-sim/libanima.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libanima.a \
            -headers ios-headers \
            -library target/universal-ios-sim/libanima.a \
            -headers ios-headers \
            -output anima.xcframework
      - name: Verify slices
        run: |
          find anima.xcframework -name '*.a' -exec lipo -info {} \;
          test -f anima.xcframework/ios-arm64/libanima.a
          test -f anima.xcframework/ios-arm64_x86_64-simulator/libanima.a
      # upload-artifact 上传目录时只保留**内容**，.xcframework 这层目录名会丢，
      # 下游无论注入还是发布都拿不到那个名字，所以这里先自己打包成 zip。
      - name: Package XCFramework
        run: zip -qry anima-engine-ios.xcframework.zip anima.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: anima-iOS-XCFramework
          path: anima-engine-ios.xcframework.zip

  # ---------------------------------------------------------------- Web
  web:
    if: inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install wasm-bindgen-cli (must match crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test on host (no GPU)
        run: cargo test -p am-wasm
      - name: Build wasm ES module
        run: |
          cargo build -p am-wasm --release --target wasm32-unknown-unknown --no-default-features
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/anima_wasm.wasm
      - name: Check output
        run: |
          test -f pkg/anima_wasm.js
          test -f pkg/anima_wasm_bg.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: anima-Web
          path: pkg


  # ---------------------------------------------------------------- Release
  # 勾选 publish_release 才跑：把各平台本次**构建成功**的产物，按稳定文件名打成
  # 资产挂到 GitHub Release。editor / viewer 侧用
  #   https://github.com/midsancode/anima-engine/releases/latest/download/<资产名>
  # 匿名直链下载（latest/download 永远指向最新 release），配置一次长期沿用。
  # 标题与 tag 都是「版本号+构建数字」（如 0.1.0+12），与编辑器/查看器口径一致。
  # 已存在的同名资产跳过上传 → 重复运行幂等，只补缺的那几个。
  release:
    needs: [windows, linux, macos, android, ios, web]
    # 用 !cancelled() 而不是 !failure()：某平台失败时仍把**成功**的那些发出去。
    if: ${{ always() && !cancelled() && inputs.publish_release && (inputs.build_windows || inputs.build_linux || inputs.build_macos || inputs.build_android || inputs.build_ios || inputs.build_web) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 不 merge：各 artifact 各占一个子目录，打包时不会把别的平台的产物卷进来。
      # 没勾的平台没有同名 artifact，这个 action 会报错，交给后面判断。
      - uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true
      - name: Read engine version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "//; s/"$//' | tr -d '\r')
          [ -n "$VERSION" ] || { echo "::error::Cargo.toml 里读不到 version"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=${VERSION}+${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p dist out
          # 按「标记文件」定位该平台的 artifact 子目录，再只打包那个目录。
          # 直接 zip 解包后的 dist 根目录会把所有平台卷进同一个包。
          pack_dir() {  # $1=标记文件 $2=输出资产名 $3=zip|tgz
            local marker="$1" name="$2" kind="$3"
            local hit dir
            hit=$(find dist -name "$marker" -type f -print -quit)
            if [ -z "$hit" ]; then
              echo "::warning::$marker 不在产物里，跳过 $name"
              return 0
            fi
            dir=$(dirname "$hit")
            case "$kind" in
              zip) (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/out/$name" .) ;;
              tgz) tar -czf "out/$name" -C "$dir" . ;;
            esac
            echo "打包 $name  <-  $dir"
          }
          pack_file() { # $1=标记文件 $2=输出资产名
            local hit
            hit=$(find dist -name "$1" -type f -print -quit)
            if [ -z "$hit" ]; then
              echo "::warning::$1 不在产物里，跳过 $2"
              return 0
            fi
            cp "$hit" "out/$2"
            echo "打包 $2  <-  $hit"
          }
          # 注意用 if/fi 而不是 `[ x ] && cmd`：set -e 下条件为假会直接终止脚本。
          if [ "${{ inputs.build_windows }}" = "true" ]; then
            pack_dir anima.dll anima-engine-windows-x64.zip zip
          fi
          if [ "${{ inputs.build_linux }}" = "true" ]; then
            pack_dir libanima.so anima-engine-linux-x64.tar.gz tgz
          fi
          if [ "${{ inputs.build_macos }}" = "true" ]; then
            pack_dir libanima.dylib anima-engine-macos-universal.tar.gz tgz
          fi
          if [ "${{ inputs.build_android }}" = "true" ]; then
            pack_file anima-android.aar anima-engine-android.aar
          fi
          if [ "${{ inputs.build_ios }}" = "true" ]; then
            pack_file anima-engine-ios.xcframework.zip anima-engine-ios.xcframework.zip
          fi
          if [ "${{ inputs.build_web }}" = "true" ]; then
            pack_dir anima_wasm.js anima-engine-web.zip zip
          fi
          echo "--- 本次资产 ---"
          find out -type f | sort
      # 合集包：把本次构建出来的平台拼成一个 anima-engine-all.zip。
      # 宿主仓库只要配**一个** ENGINE_URL 指向它，就不必逐个平台配地址、
      # 也就不会漏配某一个导致那个平台悄悄退化成内置实现。
      - name: Pack combined bundle
        run: bash .github/scripts/pack_bundle.sh out "$VERSION" "${{ github.run_number }}"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=$(find out -type f | sort)
          if [ -z "$FILES" ]; then
            echo "::error::一个资产都没打出来，不建空 Release"
            exit 1
          fi
          NOTES=$(printf 'Anima Engine %s\n\n- build: %s\n- commit: %s\n' \
            "$VERSION" "${{ github.run_number }}" "$GITHUB_SHA")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，补齐缺失资产"
          else
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          upload=()
          for f in $FILES; do
            base=$(basename "$f")
            # here-string 而非管道：pipefail 下 grep -q 提前退出可能让 printf 吃 SIGPIPE。
            if [ -n "$EXISTING" ] && grep -Fxq -- "$base" <<< "$EXISTING"; then
              echo "跳过已存在：$base"
              continue
            fi
            upload+=("$f")
          done
          if [ ${#upload[@]} -eq 0 ]; then
            echo "所有资产都已存在，无需上传"
          else
            gh release upload "$TAG" "${upload[@]}"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
